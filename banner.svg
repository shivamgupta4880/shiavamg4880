<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Shivam Gupta — Founder, S&amp;S Global AI Solutions">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a3a"/>
      <stop offset="100%" stop-color="#0e2a47"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: 'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
      @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      .float { animation: float 6s ease-in-out infinite; }
      .node { animation: pulse 3s ease-in-out infinite; }
      .n2 { animation-delay: .6s } .n3 { animation-delay: 1.2s } .n4 { animation-delay: 1.8s } .n5 { animation-delay: 2.4s }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <circle cx="1020" cy="70" r="220" fill="url(#glow2)"/>
  <circle cx="140" cy="300" r="200" fill="url(#glow1)"/>

  <!-- neural-network motif -->
  <g transform="translate(860 70)"><g class="float" stroke="url(#accent)" stroke-opacity="0.5" stroke-width="1.5" fill="none">
    <path d="M20 40 L130 20 M20 40 L130 90 M20 40 L130 160 M20 120 L130 20 M20 120 L130 90 M20 120 L130 160 M20 190 L130 90 M20 190 L130 160 M130 20 L250 90 M130 90 L250 90 M130 160 L250 90 M130 20 L250 160 M130 90 L250 160 M130 160 L250 160"/>
    <g stroke="none" fill="#22d3ee">
      <circle class="node" cx="20" cy="40" r="7"/>
      <circle class="node n2" cx="20" cy="120" r="7"/>
      <circle class="node n3" cx="20" cy="190" r="7"/>
    </g>
    <g stroke="none" fill="#7dd3fc">
      <circle class="node n4" cx="130" cy="20" r="8"/>
      <circle class="node n5" cx="130" cy="90" r="8"/>
      <circle class="node n2" cx="130" cy="160" r="8"/>
    </g>
    <g stroke="none" fill="#a78bfa">
      <circle class="node n3" cx="250" cy="90" r="9"/>
      <circle class="node" cx="250" cy="160" r="9"/>
    </g>
  </g></g>

  <!-- text -->
  <g class="sans">
    <text x="64" y="84" fill="#22d3ee" font-size="16" font-weight="600" letter-spacing="4">S&amp;S GLOBAL AI SOLUTIONS</text>
    <text x="64" y="150" fill="#ffffff" font-size="60" font-weight="800">Shivam Gupta</text>
    <rect x="64" y="168" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="64" y="212" fill="#cbd5e1" font-size="24" font-weight="500">Founder  ·  Full-Stack Developer  ·  AI Solutions</text>
  </g>
  <g class="mono" font-size="16" fill="#94a3b8">
    <text x="64" y="268"><tspan fill="#22d3ee">Website:</tspan> shivamguptadev.me</text>
    <text x="370" y="268"><tspan fill="#a78bfa">✆</tspan> +91 75709 50739</text>
    <text x="570" y="268"><tspan fill="#22d3ee">✉</tspan> shivamgupt4880@gmail.com</text>
  </g>
</svg>
